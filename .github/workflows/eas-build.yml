name: EAS Build & Submit iOS

on:
  push:
    branches:
      - main          # mainブランチへのpush → 本番ビルド＆Submit
      - develop       # developブランチへのpush → プレビュービルド
  pull_request:
    branches:
      - main          # mainへのPR → プレビュービルドで検証
  workflow_dispatch:   # 手動実行も可能
    inputs:
      profile:
        description: 'ビルドプロファイル (development/preview/production)'
        required: true
        default: 'preview'
        type: choice
        options:
          - development
          - preview
          - production

jobs:
  build-ios:
    name: Build iOS (EAS)
    runs-on: ubuntu-latest

    steps:
      # 1. リポジトリのチェックアウト
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Node.js のセットアップ（LTS版）
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      # 3. 依存パッケージのインストール
      - name: Install dependencies
        run: npm ci

      # 4. EAS CLI のインストール
      - name: Install EAS CLI
        run: npm install -g eas-cli

      # 5. Expo アカウントでログイン
      - name: Login to Expo
        run: eas whoami
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      # 6. ビルドプロファイルの決定
      #    - main ブランチ → production
      #    - develop ブランチ / PR → preview
      #    - 手動実行 → 入力値を使用
      - name: Set build profile
        id: profile
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "profile=${{ github.event.inputs.profile }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "profile=production" >> $GITHUB_OUTPUT
          else
            echo "profile=preview" >> $GITHUB_OUTPUT
          fi

      # 7. iOS ビルド
      - name: EAS Build for iOS (${{ steps.profile.outputs.profile }})
        run: eas build --platform ios --profile ${{ steps.profile.outputs.profile }} --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

  # 本番ビルド時のみ TestFlight へ Submit
  submit-ios:
    name: Submit to TestFlight
    runs-on: ubuntu-latest
    needs: build-ios
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: EAS Submit to TestFlight
        run: eas submit --platform ios --latest --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
