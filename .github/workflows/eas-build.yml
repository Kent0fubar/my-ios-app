name: CI Check & EAS Build

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      profile:
        description: 'ビルドプロファイル (development/preview/production)'
        required: true
        default: 'preview'
        type: choice
        options:
          - development
          - preview
          - production

jobs:
  # ============================================================
  # 全pushで実行: TypeScriptチェック + テスト
  # ============================================================
  check:
    name: TypeScript & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test

  # ============================================================
  # iOS ビルド: 手動実行(workflow_dispatch)のみ
  # Apple Developer の証明書設定が必要
  # ============================================================
  build-ios:
    name: Build iOS (EAS)
    runs-on: ubuntu-latest
    needs: check
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Login to Expo
        run: eas whoami
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Configure EAS project
        run: |
          if [ -z "$(grep -o 'projectId' app.json)" ]; then
            eas init --non-interactive --force
          fi
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: EAS Build for iOS (${{ github.event.inputs.profile }})
        run: eas build --platform ios --profile ${{ github.event.inputs.profile }} --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

  # ============================================================
  # 本番 Submit: 手動 production ビルド後のみ
  # ============================================================
  submit-ios:
    name: Submit to TestFlight
    runs-on: ubuntu-latest
    needs: build-ios
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.profile == 'production'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: EAS Submit to TestFlight
        run: eas submit --platform ios --latest --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
