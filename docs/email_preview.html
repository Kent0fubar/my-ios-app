<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BandLink - パスワードリセットメール プレビュー</title>
</head>
<body style="margin: 0; padding: 0; background-color: #0A0A1A; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color: #0A0A1A; min-height: 100vh;">
    <tr>
      <td align="center" style="padding: 40px 20px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width: 480px; background: linear-gradient(180deg, #1A1A2E 0%, #16162A 100%); border-radius: 24px; border: 1px solid rgba(229, 192, 123, 0.15); overflow: hidden;">

          <!-- Gold accent bar -->
          <tr>
            <td style="height: 4px; background: linear-gradient(90deg, #E5C07B 0%, #D4AF37 50%, #B9934B 100%);"></td>
          </tr>

          <!-- Logo & Header -->
          <tr>
            <td align="center" style="padding: 40px 32px 24px;">
              <!-- Logo icon -->
              <div style="width: 56px; height: 56px; border-radius: 16px; background: linear-gradient(135deg, #E5C07B 0%, #D4AF37 100%); display: inline-flex; align-items: center; justify-content: center; margin-bottom: 20px;">
                <span style="font-size: 28px;">♪</span>
              </div>
              <h1 style="margin: 0 0 8px; font-size: 22px; font-weight: 800; color: #FFFFFF; letter-spacing: -0.3px;">パスワードリセット</h1>
              <p style="margin: 0; font-size: 14px; color: #A0A0C0; line-height: 1.5;">パスワードのリセットがリクエストされました</p>
            </td>
          </tr>

          <!-- Divider -->
          <tr>
            <td style="padding: 0 32px;">
              <div style="height: 1px; background: rgba(255,255,255,0.08);"></div>
            </td>
          </tr>

          <!-- Body -->
          <tr>
            <td style="padding: 28px 32px;">
              <p style="margin: 0 0 20px; font-size: 15px; color: #D0D0E0; line-height: 1.7;">
                BandLinkアカウントのパスワードリセットがリクエストされました。下のボタンをタップして、新しいパスワードを設定してください。
              </p>

              <!-- CTA Button -->
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                <tr>
                  <td align="center" style="padding: 8px 0 24px;">
                    <a href="#" style="display: inline-block; padding: 16px 40px; background: linear-gradient(90deg, #E5C07B 0%, #D4AF37 100%); color: #0A0A1A; font-size: 16px; font-weight: 800; text-decoration: none; border-radius: 50px; letter-spacing: 0.3px;">
                      パスワードをリセット
                    </a>
                  </td>
                </tr>
              </table>

              <!-- Security notice -->
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background: rgba(255,255,255,0.03); border-radius: 12px; border: 1px solid rgba(255,255,255,0.06);">
                <tr>
                  <td style="padding: 16px;">
                    <p style="margin: 0 0 4px; font-size: 12px; font-weight: 600; color: #A0A0C0;">
                      🔒 セキュリティに関する注意
                    </p>
                    <p style="margin: 0; font-size: 12px; color: #6B6B8D; line-height: 1.6;">
                      このリクエストに心当たりがない場合は、このメールを無視してください。パスワードは変更されません。リンクの有効期限は24時間です。
                    </p>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Divider -->
          <tr>
            <td style="padding: 0 32px;">
              <div style="height: 1px; background: rgba(255,255,255,0.08);"></div>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td align="center" style="padding: 24px 32px 32px;">
              <p style="margin: 0 0 4px; font-size: 13px; font-weight: 700; color: #E5C07B;">BandLink</p>
              <p style="margin: 0; font-size: 11px; color: #6B6B8D; line-height: 1.5;">音楽でつながるマッチングアプリ</p>
            </td>
          </tr>

        </table>

        <!-- Sub-footer -->
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width: 480px;">
          <tr>
            <td align="center" style="padding: 20px 32px;">
              <p style="margin: 0; font-size: 11px; color: #4A4A6A; line-height: 1.5;">
                このメールはBandLinkのパスワードリセット機能により自動送信されています。
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
